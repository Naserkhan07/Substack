name: Automated Notes & Micro-Content

on:
  schedule:
    # 07:00 UTC (12:30 PM IST), 10:00 UTC (3:30 PM IST), 12:30 UTC (6:00 PM IST)
    - cron: '0 7,10,12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to publish'
        required: true
        default: 'afternoon'
        type: choice
        options:
          - midday
          - afternoon
          - evening
          - night

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch Scheduled Note
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLOT="${{ inputs.slot || 'afternoon' }}"
          python main.py note --slot "$SLOT"

      - name: Commit Database State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Naser AI Media Engine Bot"
          git add database/media_engine.db
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(notes): record dispatched note [skip ci]"
            git push
          fi
