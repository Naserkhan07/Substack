name: Daily Long-Form Article Publishing

on:
  schedule:
    # 03:30 UTC is 9:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Editorial Publishing Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREELLM_ENDPOINT: ${{ secrets.FREELLM_ENDPOINT }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py publish

      - name: Commit and Persist Articles, Images & Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Naser AI Media Engine Bot"
          git add database/media_engine.db articles/ images/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(publishing): auto-publish daily feature article [skip ci]"
            git push
          fi
